openapi: 3.1.0
info:
  title: Acme4go HTTP API
  version: 0.1.0
  description: |
    管理面使用 HttpOnly Cookie 会话。除 GET/HEAD/OPTIONS 外，管理请求必须携带登录响应中的 X-CSRF-Token。
    私钥下载虽然使用 GET，也必须携带 X-CSRF-Token。Agent API 在首次注册后要求内部 CA 签发的 mTLS 客户端证书。
    Agent 普通请求全局最多 6 个、单节点最多 2 个；心跳和身份续签共享独立的全局 2 个、单节点 1 个名额。
    单节点并发超限返回 429，全局额度或认证查询繁忙返回 503。Agent POST 请求体须在请求头完成后的 5 秒内读完。
servers:
  - url: http://127.0.0.1:8080
    description: 管理面
tags:
  - name: Auth
  - name: Certificates
  - name: DNS
  - name: Credentials
  - name: Agents
  - name: Cloud
  - name: Deployments
  - name: Audit
  - name: Alerts
  - name: Agent Protocol
paths:
  /healthz:
    get:
      security: []
      summary: 存活检查
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /readyz:
    get:
      security: []
      summary: 就绪检查
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/auth/login:
    post:
      tags: [Auth]
      security: []
      summary: 管理员登录并设置会话 Cookie
      description: 同来源全部登录请求每分钟最多 30 次；来源与账号组合仍有五次失败预算。用户名最多 256 字节、密码最多 1024 字节（UTF-8）。凭据校验后发生改密时，旧认证结果不能创建会话。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, minLength: 1, maxLength: 256, description: UTF-8 编码最多 256 字节 }
                password: { type: string, format: password, minLength: 1, maxLength: 1024, description: UTF-8 编码最多 1024 字节 }
      responses:
        "200":
          description: 登录成功
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data: { $ref: "#/components/schemas/LoginResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/auth/me:
    get:
      tags: [Auth]
      summary: 当前管理员
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Error" }
  /api/auth/logout:
    post:
      tags: [Auth]
      summary: 注销当前会话
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/auth/password:
    post:
      tags: [Auth]
      summary: 修改密码并失效全部会话
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password, maxLength: 1024 }
                newPassword: { type: string, format: password, maxLength: 1024, description: UTF-8 编码为 12 至 1024 字节 }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/dashboard:
    get:
      summary: 当前及实际部署版本的运行指标
      description: certificateTotal 和生命周期数量仅统计启用系列当前版本及启用目标最近成功使用的版本；historyVersionTotal 是包含历史版本的证书库总量；upcomingCertificates 是全库在用版本按到期时间排序的前五条。
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/orders:
    get:
      tags: [Certificates]
      summary: 分页查询证书申请订单
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/SeriesID"
        - name: status
          in: query
          schema: { type: string, enum: [ALL, QUEUED, RUNNING, SUCCESS, FAILED], default: ALL }
      responses:
        "200": { $ref: "#/components/responses/Success" }
    post:
      tags: [Certificates]
      summary: 提交证书申请
      description: 相同 CA 和域名集合的系列仅允许一笔排队或执行中订单。重复申请返回 409，校验或订单写入失败不会遗留新系列。
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrder" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/orders/{id}:
    get:
      tags: [Certificates]
      summary: 查询订单最新状态和脱敏执行时间线
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: data 包含 order 最新订单快照及按事件 ID 升序排列的 events。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data:
                        type: object
                        required: [order, events]
                        properties:
                          order: { type: object, description: 与订单列表相同的订单对象 }
                          events: { type: array, items: { $ref: "#/components/schemas/OrderEvent" } }
        "404": { $ref: "#/components/responses/Error" }
  /api/orders/{id}/retry:
    post:
      tags: [Certificates]
      summary: 重试失败订单
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/CSRF"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /api/certificates:
    get:
      tags: [Certificates]
      summary: 分页查询证书版本清单
      description: 所有条件在分页前作用于全库，data.summary 返回相同筛选范围的 total、valid、expiring、expired，包含历史版本。
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/SeriesID"
        - name: status
          in: query
          schema: { type: string, enum: [ALL, VALID, EXPIRING, EXPIRED], default: ALL }
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/certificate-series:
    get:
      tags: [Certificates]
      summary: 稳定证书系列与当前版本清单
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/certificate-series/{seriesId}:
    put:
      tags: [Certificates]
      summary: 显式更新系列长期续期配置
      parameters:
        - name: seriesId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CertificateSeriesInput" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/certificates/{id}/download:
    get:
      tags: [Certificates]
      summary: 下载 PEM 材料
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: type
          in: query
          required: true
          schema: { type: string, enum: [CERTIFICATE, FULL_CHAIN, PRIVATE_KEY] }
        - $ref: "#/components/parameters/OptionalCSRF"
      responses:
        "200":
          description: PEM 文件；PRIVATE_KEY 类型要求 CSRF Header
          content:
            application/x-pem-file: { schema: { type: string, format: binary } }
        "403": { $ref: "#/components/responses/Error" }
  /api/dns-credentials:
    get:
      tags: [DNS]
      summary: DNS 凭据清单（不返回明文密钥）
      responses:
        "200": { $ref: "#/components/responses/Success" }
    post:
      tags: [DNS]
      summary: 新建 DNS 凭据
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DNSCredentialInput" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/dns-credentials/{id}:
    put:
      tags: [DNS]
      summary: 更新 DNS 凭据，密钥留空表示保留原值
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DNSCredentialInput" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
    delete:
      tags: [DNS]
      summary: 删除未被证书引用的 DNS 凭据
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/CSRF"
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/dns-credentials/{id}/test:
    post:
      tags: [DNS]
      summary: 通过临时 TXT 记录验证服务商凭据写入和清理权限
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/CSRF"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "502": { $ref: "#/components/responses/Error" }
  /api/agents:
    get:
      tags: [Agents]
      summary: 已注册 Agent 清单
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/agents/enrollments:
    post:
      tags: [Agents]
      summary: 创建十分钟有效的一次性 Join URL
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties: { name: { type: string, maxLength: 100 } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/agents/{agentId}:
    delete:
      tags: [Agents]
      summary: 撤销 Agent
      parameters:
        - name: agentId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/CSRF"
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/deployments/targets:
    get:
      tags: [Deployments]
      summary: 部署目标
      responses:
        "200": { $ref: "#/components/responses/Success" }
    post:
      tags: [Deployments]
      summary: 创建本机或 Agent 部署目标
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeploymentTargetInput" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/deployments/targets/{id}:
    put:
      tags: [Deployments]
      summary: 更新部署目标
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeploymentTargetInput" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
    delete:
      tags: [Deployments]
      summary: 删除配置但保留磁盘文件
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/CSRF"
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/deployments/targets/{id}/sync:
    post:
      tags: [Deployments]
      summary: 本机立即同步或登记远程 Agent 单次同步
      description: 远程请求持久保留至 Agent 回报终态，返回 manualSync=true；不改变自动部署开关，重复活动请求复用同一修订。修改目标配置会取消旧请求。
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/CSRF"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /api/deployments/records:
    get:
      tags: [Deployments]
      summary: 最近部署结果
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/system/info:
    get:
      summary: 当前 Server 角色、能力与非敏感运行参数
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/audit-logs:
    get:
      tags: [Audit]
      summary: 按游标查询管理员敏感操作记录
      parameters:
        - name: cursor
          in: query
          schema: { type: integer, format: int64, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: action
          in: query
          schema: { type: string }
        - name: resourceType
          in: query
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/alerts:
    get:
      tags: [Alerts]
      summary: 查询持久通知的投递状态和历史
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          schema: { type: string, enum: [ALL, PENDING, SENDING, RETRY, SENT, FAILED], default: ALL }
      responses:
        "200":
          description: data 是分页对象，items 为通知投递记录。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data:
                        type: object
                        properties:
                          items: { type: array, items: { $ref: "#/components/schemas/AlertDelivery" } }
                          total: { type: integer }
                          page: { type: integer }
                          pageSize: { type: integer }
  /api/alerts/test:
    post:
      tags: [Alerts]
      summary: 创建测试通知
      description: 入队成功不代表已经送达，实际发送结果通过通知列表查询。Webhook 未配置时返回 409。
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /api/alerts/{id}/retry:
    post:
      tags: [Alerts]
      summary: 将失败或等待重试的通知重新排队
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/CSRF"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /agent/v1/enroll:
    post:
      tags: [Agent Protocol]
      security: []
      servers: [{ url: "https://127.0.0.1:9443" }]
      summary: 使用一次性 Token 注册 Agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, csr, version, platform]
              properties:
                token: { type: string }
                csr: { type: string, description: PEM CSR }
                version: { type: string }
                platform: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /agent/v1/desired-state:
    get:
      tags: [Agent Protocol]
      security: [{ mutualTLS: [] }]
      servers: [{ url: "https://127.0.0.1:9443" }]
      summary: 拉取当前 Agent 的期望部署目标
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /agent/v1/heartbeat:
    post:
      tags: [Agent Protocol]
      security: [{ mutualTLS: [] }]
      servers: [{ url: "https://127.0.0.1:9443" }]
      summary: 上报版本、平台和在线状态
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /agent/v1/identity/renew:
    post:
      tags: [Agent Protocol]
      security: [{ mutualTLS: [] }]
      servers: [{ url: "https://127.0.0.1:9443" }]
      summary: 续签当前 Agent 客户端证书
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /agent/v1/certificates/{id}:
    get:
      tags: [Agent Protocol]
      security: [{ mutualTLS: [] }]
      servers: [{ url: "https://127.0.0.1:9443" }]
      summary: 下载已授权证书 Bundle
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /agent/v1/deployments/result:
    post:
      tags: [Agent Protocol]
      security: [{ mutualTLS: [] }]
      servers: [{ url: "https://127.0.0.1:9443" }]
      summary: 上报部署结果
      description: 必须携带目标期望状态中的 revision；过期修订或已撤销授权返回 409，缺少修订的旧 Agent 必须升级。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeploymentResultInput" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/cloud/products:
    get:
      tags: [Cloud]
      summary: 获取云产品能力与动态配置字段
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/credentials/{id}/cloud-certificates:
    get:
      tags: [Cloud]
      summary: 分页读取阿里云中国站有效证书元数据
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
        - name: search
          in: query
          schema: { type: string, maxLength: 253 }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/cloud/plans:
    get:
      tags: [Cloud]
      summary: 列出只上传规则和产品部署目标
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    post:
      tags: [Cloud]
      summary: 创建云规则；自动同步启用后由工作者执行
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CloudPlanInput" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/cloud/plans/{id}:
    put:
      tags: [Cloud]
      summary: 修改云配置；有活动任务时拒绝修改
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CloudPlanInput" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Cloud]
      summary: 删除本地配置，保留云端证书与产品绑定
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/cloud/plans/{id}/run:
    post:
      tags: [Cloud]
      summary: 将当前证书版本加入持久队列，返回 CloudJob
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/cloud/jobs:
    get:
      tags: [Cloud]
      summary: 按 before 游标查询最近五十个 CloudJob
      parameters:
        - name: before
          in: query
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/cloud/jobs/{id}:
    get:
      tags: [Cloud]
      summary: 查询单个持久云任务
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/credentials:
    get:
      tags: [Credentials]
      summary: 全用途共享凭据列表
      responses:
        "200": { $ref: "#/components/responses/Success" }
    post:
      tags: [Credentials]
      summary: 创建共享凭据并选择用途
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CredentialInput" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /api/credentials/{id}:
    put:
      tags: [Credentials]
      summary: 更新共享凭据和用途，空秘密保留原值
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CredentialInput" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Credentials]
      summary: 删除未被引用的共享凭据
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/CSRF"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: acme4go_session
    mutualTLS:
      type: mutualTLS
  parameters:
    Search:
      name: search
      in: query
      schema: { type: string, maxLength: 200 }
      description: 不区分大小写的域名、系列名称或编码查询，订单还支持编号精确查询。
    SeriesID:
      name: seriesId
      in: query
      schema: { type: string, maxLength: 128 }
      description: 可选的稳定证书系列标识。
    ID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
    OptionalCSRF:
      name: X-CSRF-Token
      in: header
      required: false
      schema: { type: string }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
  schemas:
    CredentialInput:
      type: object
      required: [name, provider, enabled, dnsEnabled, cloudEnabled]
      properties:
        name: { type: string, maxLength: 100 }
        provider: { type: string, enum: [ALIYUN, CLOUDFLARE] }
        zone: { type: string, description: DNS 用途必填；仅云部署可留空 }
        accessKeyId: { type: string, writeOnly: true }
        accessKeySecret: { type: string, writeOnly: true }
        enabled: { type: boolean }
        dnsEnabled: { type: boolean }
        cloudEnabled: { type: boolean, description: 当前仅阿里云支持，至少开启一种用途 }
    DeploymentResultInput:
      type: object
      required: [targetId, revision, certificateId, fingerprint, status]
      properties:
        targetId: { type: integer, format: int64, minimum: 1 }
        revision: { type: integer, format: int64, minimum: 1, description: 执行部署时的目标配置修订号 }
        certificateId: { type: integer, format: int64, minimum: 1 }
        fingerprint: { type: string, minLength: 1 }
        status: { type: string, enum: [RUNNING, SUCCESS, FAILED] }
        message: { type: string, description: 不包含密钥的执行摘要，超出 500 个字符时截断 }
    Envelope:
      type: object
      required: [success, data, message, timestamp]
      properties:
        success: { type: boolean }
        data: {}
        message: { type: string }
        code: { type: [string, "null"] }
        timestamp: { type: string, format: date-time }
    LoginResult:
      type: object
      required: [csrfToken, expiresAt, user]
      properties:
        csrfToken: { type: string }
        expiresAt: { type: string, format: date-time }
        user:
          type: object
          properties:
            id: { type: integer, format: int64 }
            username: { type: string }
            displayName: { type: string }
    CreateOrder:
      type: object
      required: [name, domains, email, caEnvironment, credentialId, agreeTerms]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        domains: { type: array, minItems: 1, maxItems: 100, items: { type: string } }
        email: { type: string, format: email }
        caEnvironment: { type: string, enum: [LETS_ENCRYPT_PRODUCTION, LETS_ENCRYPT_STAGING] }
        credentialId: { type: integer, format: int64 }
        agreeTerms: { type: boolean, const: true }
    DNSCredentialInput:
      type: object
      required: [name, provider, zone, enabled]
      properties:
        name: { type: string }
        provider: { type: string, enum: [ALIYUN, CLOUDFLARE], description: 已有凭据的服务商不可修改 }
        zone: { type: string }
        accessKeyId: { type: string, description: 阿里云 AccessKeyId；Cloudflare 无需填写 }
        accessKeySecret: { type: string, format: password, description: 阿里云 Secret 或 Cloudflare API Token；编辑留空保留原值 }
        enabled: { type: boolean }
    DeploymentTargetInput:
      type: object
      required: [executorType, name, certificateSeriesId, targetAlias, enabled]
      properties:
        executorType: { type: string, enum: [LOCAL, AGENT] }
        agentId:
          type: [string, "null"]
          format: uuid
          description: executorType 为 AGENT 时必填，为 LOCAL 时必须为空
        name: { type: string }
        certificateSeriesId: { type: string, format: uuid }
        targetAlias: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,63}$" }
        enabled: { type: boolean }
    CertificateSeriesInput:
      type: object
      required: [name, email, credentialId, autoRenew, enabled]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email }
        credentialId: { type: integer, format: int64, minimum: 1 }
        autoRenew: { type: boolean }
        enabled: { type: boolean }
    OrderEvent:
      type: object
      required: [id, orderId, stage, message, createdAt]
      properties:
        id: { type: integer, format: int64 }
        orderId: { type: integer, format: int64 }
        stage: { type: string }
        message: { type: string, description: 仅含系统生成的阶段说明或脱敏失败摘要 }
        createdAt: { type: string, format: date-time }
    AlertDelivery:
      type: object
      required: [id, event, severity, resourceType, resourceId, message, timestamp, status, attempts, nextAttemptAt]
      properties:
        id: { type: integer, format: int64, description: Webhook 载荷中的幂等去重标识 }
        event: { type: string }
        severity: { type: string, enum: [INFO, WARNING, ERROR] }
        resourceType: { type: string }
        resourceId: { type: string }
        message: { type: string }
        timestamp: { type: string, format: date-time, description: 原始事件时间，重试期间不变 }
        status: { type: string, enum: [PENDING, SENDING, RETRY, SENT, FAILED] }
        attempts: { type: integer, minimum: 0 }
        nextAttemptAt: { type: string, format: date-time }
        lastError: { type: [string, "null"] }
        deliveredAt: { type: [string, "null"], format: date-time }
    CloudPlanInput:
      type: object
      additionalProperties: false
      required: [name, credentialId, kind, product, seriesId, remoteCertificateId, config, autoSync, enabled]
      description: seriesId 与 remoteCertificateId 二选一。UPLOAD 只允许本地系列且 product 为空；自动同步只适用于本地系列。
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        credentialId: { type: integer, format: int64, minimum: 1 }
        kind: { type: string, enum: [UPLOAD, DEPLOY] }
        product: { type: string, description: 来自 products 接口，当前为 OSS 或 CDN；UPLOAD 使用空字符串 }
        seriesId: { type: [string, "null"] }
        remoteCertificateId: { type: string, description: 阿里云证书数字 ID，字符串传输避免精度损失 }
        config:
          type: object
          description: 产品独立配置；CDN 需要 domain，OSS 需要 domain、bucket、region
          additionalProperties: { type: string }
        autoSync: { type: boolean, description: 自动执行当前及后续续期版本；失败五分钟后重试，同版本最多三次 }
        enabled: { type: boolean }
    CloudJob:
      type: object
      properties:
        id: { type: integer, format: int64 }
        planId: { type: integer, format: int64 }
        planName: { type: string }
        revision: { type: integer, format: int64 }
        certificateId: { type: [integer, "null"], format: int64 }
        remoteCertificateId: { type: string }
        status: { type: string, enum: [QUEUED, RUNNING, SUCCESS, FAILED] }
        stage: { type: string, enum: [QUEUED, UPLOAD, DEPLOY, VERIFY, COMPLETE] }
        message: { type: string, description: 不含私钥和凭证的结果摘要 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
  responses:
    Success:
      description: 成功信封
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    Error:
      description: 安全业务错误信封
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
security:
  - sessionCookie: []
